name: Website
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/assets/**", "docs/media/**", "public/brand/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/assets _site/brand _site/media
          cp -r site/. _site/
          cp docs/assets/*.webp docs/assets/*.png _site/assets/ 2>/dev/null || true
          cp public/brand/* _site/brand/
          cp docs/media/*.mp4 _site/media/ 2>/dev/null || true
      - name: Demo films (kept in the latest release, not in git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$GITHUB_REPOSITORY" --pattern "ReadMe-demo-*.mp4" --dir _site/media --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
