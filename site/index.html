<style>
:root{--t-xs:13px;--t-sm:15px;--t-md:18px;--t-lg:22px;--t-xl:28px;--t-h2:clamp(30px,4vw,48px);--t-display:clamp(36px,6.4vw,76px);--bg:#fbfbf9;--fg:#0f1115;--muted:#5d6370;--faint:#8b909b;--line:rgba(15,17,21,.08);--card:#fff;--teal:#0ac7f0;--blue:#2f8bff;--ink2:#1b1f27;--yellow:#ffc53d;--radius:22px}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html:lang(zh-CN) body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
html:lang(ja) body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans CJK JP","Yu Gothic UI",Meiryo,sans-serif}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.grad{background:linear-gradient(100deg,var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}

nav{position:sticky;top:0;z-index:20;backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:var(--t-md);letter-spacing:-.3px}
.brand img{width:30px;height:30px;border-radius:8px}
.links{display:flex;align-items:center;gap:26px;font-size:var(--t-sm);color:var(--muted)}
.links a:hover{color:var(--fg)}
.lang{display:flex;gap:2px;background:var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:inherit;font-size:var(--t-xs);padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:13px 22px;font-weight:600;font-size:var(--t-sm);transition:transform .15s ease,box-shadow .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--fg);color:var(--bg);box-shadow:0 8px 24px -10px rgba(15,17,21,.5)}
.btn.ghost{border:1px solid var(--line);background:var(--card)}
.btn svg{width:18px;height:18px}
/* hero */
.hero{position:relative;padding:96px 0 40px;text-align:center}
.hero::before{content:"";position:absolute;inset:-120px 0 auto;height:620px;background:radial-gradient(40% 50% at 35% 30%,rgba(10,199,240,.18),transparent 70%),radial-gradient(40% 50% at 68% 25%,rgba(47,139,255,.16),transparent 70%);pointer-events:none;z-index:-1}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-xs);color:var(--muted);border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px;margin-bottom:28px}
.eyebrow b{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(10,199,240,.18)}
h1{font-size:var(--t-display);word-break:keep-all;overflow-wrap:anywhere;line-height:1.08;letter-spacing:-.035em;font-weight:750;max-width:980px;margin:0 auto}
:lang(zh) h1,:lang(ja) h1{letter-spacing:-.01em;line-height:1.18}
.lede{font-size:var(--t-md);color:var(--muted);max-width:720px;margin:24px auto 0}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:36px}
.note{font-size:var(--t-xs);color:var(--faint);margin-top:14px}
.shot{margin:64px auto 0;max-width:1160px}
.shot img{width:100%;border-radius:18px}
/* sections */
section{padding:110px 0}
.kicker{font-size:var(--t-xs);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue);margin-bottom:14px}
h2{font-size:var(--t-h2);line-height:1.15;letter-spacing:-.03em;font-weight:720;max-width:820px}
:lang(zh) h2,:lang(ja) h2{letter-spacing:-.005em}
.sub{color:var(--muted);font-size:var(--t-md);max-width:640px;margin-top:16px}
.center{text-align:center}.center h2,.center .sub{margin-left:auto;margin-right:auto}
/* video */
.video{margin-top:48px;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#000;aspect-ratio:16/9;box-shadow:0 40px 80px -40px rgba(15,17,21,.35)}
.video video{width:100%;height:100%;object-fit:cover}
/* features */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:56px}
.f{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 26px 0;display:flex;flex-direction:column;overflow:hidden;min-height:520px}
.f h3{font-size:var(--t-lg);letter-spacing:-.02em;margin-bottom:8px}
.f p{color:var(--muted);font-size:var(--t-sm)}
.f .ph{margin:26px auto -150px;width:78%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.f:hover .ph{transform:translateY(-10px)}
/* ledger */
.ledger{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.ledger .card{justify-self:center;max-width:430px;width:100%;transform:rotate(-2deg)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:var(--t-sm);color:var(--muted)}
.chip.on{color:var(--fg)}
.chip.on::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);margin-right:8px;vertical-align:1px}
/* privacy */
.priv{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:48px}
.p{border-top:2px solid var(--fg);padding-top:18px;font-size:var(--t-sm);color:var(--muted)}
.p b{display:block;color:var(--fg);font-size:var(--t-xl);margin-bottom:6px}
/* download */
.dl{background:var(--ink2);color:#f3f4f6;border-radius:32px;padding:72px 56px;position:relative;overflow:hidden}
.dl::before{content:"";position:absolute;inset:0;background:radial-gradient(50% 70% at 85% 0%,rgba(47,139,255,.35),transparent 70%),radial-gradient(40% 60% at 10% 100%,rgba(10,199,240,.25),transparent 70%)}
.dl>*{position:relative}
.dl h2{color:#fff}.dl .sub{color:rgba(255,255,255,.65)}
.oses{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:40px}
.os{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:22px;transition:background .2s}
.os:hover{background:rgba(255,255,255,.1)}
.os.me{background:#fff;color:#0f1115;border-color:#fff}
.os .t{font-weight:650;font-size:var(--t-md)}.os .d{font-size:var(--t-xs);opacity:.65;margin-top:4px}
.dl .how{margin-top:28px;font-size:var(--t-sm);color:rgba(255,255,255,.6);max-width:820px}
.dl code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(255,255,255,.08);padding:2px 7px;border-radius:6px;font-size:.9em}
/* faq */
details{border-bottom:1px solid var(--line);padding:22px 0}
summary{cursor:pointer;font-weight:600;font-size:var(--t-md);list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::after{content:"+";color:var(--faint);font-weight:400;font-size:var(--t-lg);line-height:1}
details[open] summary::after{content:"−"}
details p{color:var(--muted);margin-top:10px;max-width:760px}
footer{border-top:1px solid var(--line);padding:40px 0 56px;color:var(--faint);font-size:var(--t-xs)}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}
@media (max-width:900px){.links .hide{display:none}.grid{grid-template-columns:1fr 1fr}.ledger{grid-template-columns:1fr}.priv,.oses{grid-template-columns:1fr 1fr}.dl{padding:48px 24px}}
@media (max-width:600px){.wrap{padding:0 16px}.grid{grid-template-columns:1fr}.f{min-height:480px}.priv,.oses{grid-template-columns:1fr}section{padding:80px 0}.hero{padding-top:64px}.links{gap:12px}}
</style>
</head>

const FEAT = {
  zh:[["today","今天要做的事","约好的时间、答应过的事，到日子出现在第一页。安排改了，旧的自动作废。"],["person","每个人的画像","喜好、忌讳、家人、近况，每一条都附着当时的原话。"],["card","说话算数账本","翻出你们互相答应过的事，谁做到、谁没做，一键生成能晒的卡片。"],["report","聊天分析","谁回得快、谁先开口、口头禅、什么时候聊得最多。本机计算，不用 AI。"],["ask","问 AI","「她换工作的事是怎么说的？」只根据你的聊天回答，并标出处。"],["calendar","日历","按恋人、朋友、同事分组，一个月里谁有什么日子，一眼看全。"]],
  en:[["today","Today","Plans and promises show up on the day they matter. When a plan changes, the old one is replaced."],["person","A profile for everyone","Likes, dislikes, family, what's new. Every line keeps the words it came from."],["card","Promise ledger","Who promised what, and who actually did it. One tap makes a card you can share."],["report","Chat stats","Who replies faster, who texts first, pet phrases, busiest hours. Computed locally, no AI."],["ask","Ask","\"What did she say about the new job?\" Answers come only from your chats, with sources."],["calendar","Calendar","A month of everyone's dates, grouped by partner, friends, coworkers and clients."]],

const CHIPS = [["iMessage",1],["WhatsApp",1],["Telegram",1],["Beeper",1],["WeChat",1],["LINE",0],["QQ",0],["Discord",0],["Instagram",0],["Messenger",0],["Google Chat",0],["Markdown / TXT",0]];
const os = (() => { const u = navigator.userAgent; if (/Windows/.test(u)) return "windows-x64.zip"; if (/Linux/.test(u) && !/Android/.test(u)) return "linux-x64.tar.gz"; if (/Mac/.test(u)) return "mac-arm64.dmg"; return null; })();

function setLang(l) {
  const t = T[l], f = FEAT[l], fs = l === "zh" ? "zh" : l;
  document.documentElement.lang = l === "zh" ? "zh-CN" : l;
  document.querySelectorAll("[data-i]").forEach((el) => { const v = t[el.dataset.i]; if (v != null) el.innerHTML = v; });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
  document.getElementById("hero").src = `assets/hero-${fs}-light.webp`;
  document.getElementById("heroDark").srcset = `assets/hero-${fs}-dark.webp`;
  document.getElementById("card").src = `assets/card-${fs}.webp`;
  const v = document.getElementById("vid"); const src = (location.hostname === "127.0.0.1" || location.hostname === "localhost") ? `media/readme-${fs}.mp4` : `${REL}ReadMe-demo-${fs}.mp4`; if (!v.src.endsWith(src)) { v.src = src; v.poster = `assets/hero-${fs}-light.webp`; }
  document.getElementById("grid").innerHTML = f.map(([k, h, p]) => `<div class="f reveal"><h3>${h}</h3><p>${p}</p><img class="ph" loading="lazy" src="assets/tile-${k}-${fs}.webp" alt="${h}"></div>`).join("");
  document.getElementById("chips").innerHTML = CHIPS.map(([n, on]) => `<span class="chip${on ? " on" : ""}">${n}</span>`).join("");
  document.getElementById("priv").innerHTML = t.priv.map(([b, s]) => `<div class="p"><b>${b}</b>${s}</div>`).join("");
  document.getElementById("oses").innerHTML = t.oses.map(([file, name, sub]) => `<a class="os${file === os ? " me" : ""}" href="${REL}ReadMe-${file}"><div class="t">${name}</div><div class="d">${sub}</div></a>`).join("");
  document.getElementById("faq").innerHTML = t.faq.map(([q, a]) => `<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  const mine = t.oses.find((o) => o[0] === os);
  document.getElementById("ctaText").textContent = mine ? `${t.dl} · ${mine[1]}` : t.dl;
  document.getElementById("cta").href = mine ? REL + "ReadMe-" + mine[0] : "#download";
  try { localStorage.setItem("readme.lang", l); } catch {}
  history.replaceState(null, "", `?lang=${l}${location.hash}`);
  observe();
}
function observe() {
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .12 });
  document.querySelectorAll(".reveal:not(.in)").forEach((el) => io.observe(el));
}
document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
const q = new URLSearchParams(location.search).get("lang");
let saved = null; try { saved = localStorage.getItem("readme.lang"); } catch {}
const nav = (navigator.language || "en").toLowerCase();
setLang(T[q] ? q : T[saved] ? saved : nav.startsWith("zh") ? "zh" : nav.startsWith("ja") ? "ja" : "en");
</script>
